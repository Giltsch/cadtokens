[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadtokens"
version = "0.2.0"
description = "STEP AP242 PMI/GD&T extraction, inspection characteristic lists and an MCP server — pure Python, fully local."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Peter Behninger"},
]
keywords = ["cad", "step", "ap242", "pmi", "gdt", "mbd", "inspection", "fai", "mcp", "manufacturing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core: zero external deps (parser + PMI runs on stdlib only)
dependencies = []

[project.optional-dependencies]
# MCP server for AI agents (Claude, local agents)
mcp = [
    "mcp>=1.2",
]
# Everything optional
all = [
    "mcp>=1.2",
]
# Development
dev = [
    "pytest>=7",
    "mcp>=1.2",
]

[project.scripts]
cadtokens = "cadtokens.cli:main"

[project.urls]
Homepage = "https://github.com/giltsch/cadtokens"
Repository = "https://github.com/giltsch/cadtokens"
Issues = "https://github.com/giltsch/cadtokens/issues"
Changelog = "https://github.com/giltsch/cadtokens/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["cadtokens*"]
