[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadtokens"
version = "0.1.0"
description = "STEP AP242 PMI/GD&T extraction, inspection characteristic lists and an MCP server — pure Python, fully local."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Peter Behninger"},
]
keywords = ["cad", "step", "ap242", "pmi", "gdt", "mbd", "inspection", "fai", "mcp", "manufacturing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core: zero external deps (parser + PMI runs on stdlib only)
dependencies = []

[project.optional-dependencies]
# MCP server for AI agents (Claude, local agents)
mcp = [
    "mcp>=1.2",
]
# Chat interface (OCC geometry + LLM) — experimental
chat = [
    "pythonocc-core>=7.8",
    "ollama>=0.4",
]
# Web UI
ui = [
    "pythonocc-core>=7.8",
    "ollama>=0.4",
    "gradio>=4.0",
]
# GNN feature recognition (experimental)
gnn = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "pythonocc-core>=7.8",
]
# Everything
all = [
    "mcp>=1.2",
    "pythonocc-core>=7.8",
    "ollama>=0.4",
    "gradio>=4.0",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "trimesh",
    "Pillow",
]

[project.scripts]
cadtokens = "cadtokens.cli:main"

[project.urls]
Homepage = "https://github.com/giltsch/cadtokens"
Repository = "https://github.com/giltsch/cadtokens"
Issues = "https://github.com/giltsch/cadtokens/issues"

[tool.setuptools.packages.find]
include = ["cadtokens*"]
